[env:devkit-v1]
extends = env:esp32wrover-dev
board = esp32dev
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = components/boards/partitions-4m.csv
build_flags = ${env.build_flags} -DAIRPLAY_LOW_MEMORY -DAIRPLAY_MINIMAL_BUILD
board_build.cmake_extra_args =
    "-DSDKCONFIG_DEFAULTS=config/sdkconfig.defaults;config/sdkconfig.defaults.wrover;config/sdkconfig.user.devkit-v1"
